# Builds, tests, and publishes the Blazor WebAssembly site to GitHub Pages
# on every push to main. Can also be run by hand from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push cancels an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test --configuration Release

      - name: Publish
        run: dotnet publish src/MeetAndGrit.Web --configuration Release --output publish

      - name: Prepare for GitHub Pages
        run: |
          # Project sites live under /<repo-name>/, so Blazor needs that as its base path.
          # A <user>.github.io repo is served from the root instead.
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          sed -i "s|<base href=\"/\" />|<base href=\"$BASE\" />|" publish/wwwroot/index.html

          # Opening a deep link like /space directly would 404 on GitHub Pages.
          # Serving the app as the 404 page lets Blazor's router handle it.
          cp publish/wwwroot/index.html publish/wwwroot/404.html

          # Stop GitHub's Jekyll processing, which hides folders starting with "_" (like _framework).
          touch publish/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
