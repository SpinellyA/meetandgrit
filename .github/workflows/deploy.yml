# Builds, tests, and publishes the Blazor WebAssembly site to GitHub Pages
# on every push to main. Can also be run by hand from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push cancels an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test --configuration Release

      - name: Publish
        run: dotnet publish src/MeetAndGrit.Web --configuration Release --output publish

      # Asks GitHub where the site is served from: "/<repo-name>" for a plain
      # github.io project site, or "" when a custom domain is set.
      - id: pages
        uses: actions/configure-pages@v5

      - name: Prepare for GitHub Pages
        run: |
          # Blazor loads all of its files relative to <base href>, so it has to match the real path.
          BASE="${{ steps.pages.outputs.base_path }}/"
          echo "Using base href: $BASE"
          sed -i "s|<base href=\"/\" />|<base href=\"$BASE\" />|" publish/wwwroot/index.html

          # Opening a deep link like /space directly would 404 on GitHub Pages.
          # Serving the app as the 404 page lets Blazor's router handle it.
          cp publish/wwwroot/index.html publish/wwwroot/404.html

          # Stop GitHub's Jekyll processing, which hides folders starting with "_" (like _framework).
          touch publish/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
